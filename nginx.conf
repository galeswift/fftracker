server {
    listen 80;
    root /usr/share/nginx/html;
    index trackerindex.html;

    # Redirects keep the visitor's host and https instead of nginx's own http://host:80
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The tracker used to be served from the site root. The proxy sends anything starting with
    # /tracker here, unstripped, so old /tracker.html?f=... links arrive here; send them to /tracker/.
    # ($request_uri is the original request, so nginx's own internal redirects never match.)
    if ($request_uri ~ "^/(tracker|trackerindex)\.html(\?|$)") {
        return 301 /tracker/$1.html$is_args$args;
    }

    # The site is public at /tracker/. Accept paths with or without that prefix, so it works
    # whether or not the proxy strips it.
    rewrite ^/tracker$ / last;
    rewrite ^/tracker/(.*)$ /$1 last;

    location / {
        try_files $uri $uri/ =404;
    }
}
